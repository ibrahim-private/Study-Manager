<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مكتبة الدراسة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap");

      :root {
        --bg: #0a0d14;
        --surface: #12161f;
        --surface-2: #171c27;
        --surface-3: #1e2430;
        --border: #262c3a;
        --border-soft: #1b2130;
        --text: #e7eaf0;
        --muted: #8891a3;
        --faint: #565e70;
        --accent: #6d5ef0;
        --accent-soft: rgba(109, 94, 240, 0.14);
        --success: #35d0a0;
        --success-soft: rgba(53, 208, 160, 0.14);
        --warning: #f5a623;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background:
          radial-gradient(1200px 600px at 85% -10%, rgba(109, 94, 240, 0.1), transparent 60%),
          radial-gradient(900px 500px at 0% 110%, rgba(53, 208, 160, 0.06), transparent 60%), var(--bg);
        color: var(--text);
        font-family: "Cairo", sans-serif;
        min-height: 100vh;
      }
      .mono {
        font-family: "IBM Plex Mono", monospace;
      }
      ::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #242a38;
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #303748;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }

      .ring {
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .ring::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(var(--ring-color, var(--accent)) calc(var(--pct, 0) * 1%), var(--border) 0);
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - var(--thick, 8px)),
          #000 calc(100% - var(--thick, 8px))
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - var(--thick, 8px)),
          #000 calc(100% - var(--thick, 8px))
        );
      }
      .sidebar-item {
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
        border-right: 3px solid transparent;
      }
      .sidebar-item[data-active="true"] {
        background: var(--surface-3);
        border-right-color: var(--accent);
      }
      .sidebar-item:hover {
        background: var(--surface-2);
      }
      .file-row,
      .folder-card {
        transition:
          background 0.12s ease,
          border-color 0.12s ease;
      }
      .file-row:hover {
        background: var(--surface-2);
      }
      .folder-card:hover {
        background: var(--surface-2);
        border-color: var(--accent) !important;
      }
      .check-btn {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        border: 1.8px solid var(--faint);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
        flex-shrink: 0;
        cursor: pointer;
      }
      .check-btn[data-done="true"] {
        background: var(--success);
        border-color: var(--success);
      }
      .badge {
        font-size: 11.5px;
        padding: 3px 9px;
        border-radius: 20px;
        font-weight: 600;
        white-space: nowrap;
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(6, 7, 11, 0.72);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        animation: fadeIn 0.15s ease;
        padding: 16px;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .modal-card {
        animation: slideUp 0.18s ease;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .field-input {
        background: var(--surface-3);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        color: var(--text);
        font-family: "Cairo", sans-serif;
        width: 100%;
        font-size: 14px;
      }
      .field-input:focus {
        border-color: var(--accent);
      }
      .field-input::placeholder {
        color: var(--faint);
      }
      textarea.field-input {
        resize: vertical;
        min-height: 60px;
        font-size: 13px;
      }
      .swatch {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition: transform 0.12s ease;
      }
      .swatch[data-selected="true"] {
        transform: scale(1.18);
        border-color: #fff;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
        border-radius: 10px;
        font-weight: 700;
        padding: 10px 18px;
        transition: filter 0.15s ease;
        font-size: 14px;
        border: none;
        cursor: pointer;
      }
      .btn-primary:hover {
        filter: brightness(1.1);
      }
      .btn-ghost {
        background: var(--surface-3);
        color: var(--muted);
        border-radius: 10px;
        font-weight: 600;
        padding: 10px 18px;
        transition: background 0.15s ease;
        font-size: 14px;
        border: none;
        cursor: pointer;
      }
      .btn-ghost:hover {
        background: var(--border);
        color: var(--text);
      }
      .cat-pill {
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: 1.5px solid var(--border);
        transition: all 0.12s ease;
        text-align: center;
      }
      .cat-pill[data-selected="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: #fff;
      }
      .hover-actions {
        opacity: 0;
        transition: opacity 0.12s ease;
      }
      .file-row:hover .hover-actions {
        opacity: 1;
      }
      .folder-card:hover .hover-actions {
        opacity: 1;
      }
      .dash-card {
        background: var(--surface);
        border: 1px solid var(--border-soft);
        border-radius: 16px;
      }
      .tab-btn {
        padding: 9px 18px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 13.5px;
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .tab-btn[data-active="true"] {
        background: var(--accent);
        color: #fff;
      }
      .tab-btn[data-active="false"] {
        background: none;
        color: var(--muted);
      }
      .tab-btn[data-active="false"]:hover {
        background: var(--surface-3);
        color: var(--text);
      }
      .note-box {
        background: var(--surface-3);
        border: 1px dashed var(--border);
        border-radius: 9px;
        padding: 8px 10px;
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 7px;
        cursor: text;
        white-space: pre-wrap;
      }
      .rich-note-display {
        background: var(--surface-3);
        border: 1px solid var(--border-soft);
        border-radius: 11px;
        padding: 12px 14px;
        margin-top: 8px;
        font-size: 13px;
        line-height: 1.7;
        color: var(--text);
        position: relative;
      }
      .rich-note-display.collapsed {
        max-height: 96px;
        overflow: hidden;
      }
      .rich-note-display.collapsed::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 36px;
        background: linear-gradient(to top, var(--surface-3), transparent);
        border-radius: 0 0 11px 11px;
        pointer-events: none;
      }
      .note-toggle-btn {
        display: none;
        align-items: center;
        gap: 4px;
        color: var(--accent);
        font-size: 11.5px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 6px;
      }
      .rich-note-display img {
        max-width: 100%;
        border-radius: 8px;
        margin: 6px 0;
        display: block;
      }
      .rich-note-display ul {
        padding-inline-start: 22px;
        margin: 6px 0;
        list-style: disc;
      }
      .rich-note-display ol {
        padding-inline-start: 22px;
        margin: 6px 0;
        list-style: decimal;
      }
      .rich-note-display b,
      .rich-note-display strong {
        color: #fff;
      }
      .rich-note-display p {
        margin: 0 0 6px;
      }
      .rich-note-display p:last-child {
        margin-bottom: 0;
      }
      .note-toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
        margin-bottom: 8px;
        background: var(--surface-3);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 5px;
      }
      .note-tool-btn {
        background: none;
        border: none;
        color: var(--muted);
        width: 30px;
        height: 30px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
      }
      .note-tool-btn:hover {
        background: var(--border);
        color: var(--text);
      }

      .note-tool-btn[data-active="true"] {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .note-editor {
        background: var(--surface-3);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        min-height: 160px;
        max-height: 340px;
        overflow-y: auto;
        font-size: 13.5px;
        line-height: 1.7;
      }
      .note-editor:focus {
        outline: none;
        border-color: var(--accent);
      }
      .note-editor img {
        max-width: 100%;
        border-radius: 8px;
        margin: 6px 0;
        display: block;
      }
      .note-editor ul {
        padding-inline-start: 22px;
        margin: 6px 0;
        list-style: disc;
      }
      .note-editor ol {
        padding-inline-start: 22px;
        margin: 6px 0;
        list-style: decimal;
      }
      .note-editor:empty:before {
        content: attr(data-placeholder);
        color: var(--faint);
      }
      .note-frac {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        vertical-align: middle;
        direction: ltr;
        margin: 0 3px;
        font-size: 0.92em;
        line-height: 1.25;
      }
      .note-frac-num,
      .note-frac-den {
        padding: 0 4px;
        min-width: 8px;
        text-align: center;
      }
      .note-frac-num {
        border-bottom: 1.6px solid currentColor;
      }
      .note-editor sub,
      .note-editor sup,
      .rich-note-display sub,
      .rich-note-display sup {
        direction: ltr;
        unicode-bidi: isolate;
      }
      .note-symbols-row {
        display: none;
        flex-wrap: wrap;
        gap: 4px;
        background: var(--surface-3);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 7px;
        margin-bottom: 8px;
      }
      .note-symbols-row[data-open="true"] {
        display: flex;
      }
      .note-sym-btn {
        background: var(--surface-2);
        border: 1px solid var(--border-soft);
        color: var(--text);
        min-width: 28px;
        height: 26px;
        padding: 0 5px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        direction: ltr;
        font-family: "IBM Plex Mono", monospace;
      }
      .note-sym-btn:hover {
        background: var(--border);
        border-color: var(--accent);
      }
      .import-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        border-radius: 9px;
      }

      .explorer-row {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .explorer-sidebar {
        width: 230px;
      }

      @media (max-width: 720px) {
        .explorer-row {
          flex-direction: column;
        }
        .explorer-sidebar {
          width: 100%;
        }
      }
      .import-row:hover {
        background: var(--surface-3);
      }
      .crumb {
        color: var(--muted);
        cursor: pointer;
      }
      .crumb:hover {
        color: var(--text);
      }

      @keyframes flashHighlight {
        0%,
        100% {
          background: transparent;
        }
        25%,
        75% {
          background: var(--accent-soft);
        }
      }
      .flash-highlight {
        animation: flashHighlight 1.6s ease;
        border-radius: 11px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      /* ---------------- constants ---------------- */
      const CATEGORY_COLORS = { منصة: "#5AA9E6", يوتيوب: "#EF4444", واجب: "#F2795B" };
      const REVIEW_INTERVALS_DAYS = [1, 21, 30]; // بعد يوم، بعد 3 أسابيع، بعد شهر
      const REVIEW_STAGE_LABELS = ["مراجعة أولى", "مراجعة تانية", "مراجعة أخيرة"];
      const SUBJECT_PALETTE = ["#6D5EF0", "#35D0A0", "#F2795B", "#5AA9E6", "#F5A623", "#B98BF0", "#EC7BB0", "#4FD1C5"];

      /* ---------------- firebase ---------------- */
      const firebaseConfig = {
        apiKey: "AIzaSyDIAc6YYSuPulqLREY19o2Y8xOcL_SkNFo",
        authDomain: "study-manager-d446c.firebaseapp.com",
        projectId: "study-manager-d446c",
        storageBucket: "study-manager-d446c.firebasestorage.app",
        messagingSenderId: "978923860016",
        appId: "1:978923860016:web:134be1b5e53d643add3df5",
      };
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();
      let saveTimer = null;

      /* ---------------- state ---------------- */
      let state = {
        subjects: [], // {id,name,color,platformId,folders:[{id,name,files:[...],folders:[...nested...]}]}
        tasks: [], // {id, subjectId, folderId, fileId}
        history: [], // {id, date:'YYYY-MM-DD', time:'HH:MM', fileId, title, category, subjectName, subjectColor, folderName}
        platforms: [], // {id, name, logoUrl}
        view: "home", // 'home' | 'explorer' | 'history'
        selectedSubjectId: null,
        folderPath: [], // array of folder ids, from subject root down to the currently open folder
        modal: null,
        loaded: false,
        taskFilter: "all", // 'all' | 'pending' | 'done' — filters the "المهام" list on the home screen
        // --- auth ---
        authChecked: false, // becomes true once Firebase tells us whether a user is signed in
        user: null, // {uid, email}
        authMode: "login", // 'login' | 'signup'
        authError: "",
        authBusy: false,
        authPwVisible: false,
      };

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }
      function esc(s) {
        return (s || "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      }

      function seedData() {
        return { subjects: [], tasks: [], history: [], platforms: [] };
      }

      /* ---------------- date helpers ---------------- */
      function todayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
      function todayFormatted() {
        const d = new Date();
        try {
          return d.toLocaleDateString("ar-EG", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
        } catch (e) {
          return d.toLocaleDateString();
        }
      }

      /* ---------------- cloud storage (Firestore — synced to the user's account) ---------------- */
      async function loadDataForUser(uid) {
        state.loaded = false;
        render();
        try {
          const docRef = db.collection("users").doc(uid);
          const snap = await docRef.get();
          if (snap.exists) {
            const data = snap.data() || {};
            state.subjects = data.subjects || [];
            state.tasks = data.tasks || [];
            state.history = data.history || [];
            state.platforms = data.platforms || [];
          } else {
            const seed = seedData();
            state.subjects = seed.subjects;
            state.tasks = seed.tasks;
            state.history = seed.history || [];
            state.platforms = seed.platforms || [];
            await docRef.set({
              subjects: state.subjects,
              tasks: state.tasks,
              history: state.history,
              platforms: state.platforms,
            });
          }
        } catch (e) {
          console.error("load failed", e);
          state.subjects = [];
          state.tasks = [];
          state.history = [];
          state.platforms = [];
        }
        state.selectedSubjectId = state.subjects[0] ? state.subjects[0].id : null;
        state.folderPath = [];
        state.loaded = true;
        render();
      }
      function saveData() {
        if (!state.user) return;
        const uid = state.user.uid;
        const snapshot = {
          subjects: state.subjects,
          tasks: state.tasks,
          history: state.history,
          platforms: state.platforms,
        };
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          db.collection("users")
            .doc(uid)
            .set(snapshot)
            .catch((e) => console.error("save failed", e));
        }, 500);
      }

      /* ---------------- auth ---------------- */
      function switchAuthMode(mode) {
        state.authMode = mode;
        state.authError = "";
        render();
      }
      function togglePasswordVisibility() {
        state.authPwVisible = !state.authPwVisible;
        const input = document.getElementById("auth-password");
        const icon = document.getElementById("auth-pw-toggle-icon");
        if (input) input.type = state.authPwVisible ? "text" : "password";
        if (icon && window.lucide) {
          icon.setAttribute("data-lucide", state.authPwVisible ? "eye-off" : "eye");
          lucide.createIcons();
        }
      }
      function authFieldsOnEnter(e) {
        if (e.key === "Enter") submitAuth();
      }
      async function submitAuth() {
        const email = (document.getElementById("auth-email") || {}).value?.trim();
        const password = (document.getElementById("auth-password") || {}).value?.trim();
        if (!email || !password) {
          state.authError = "من فضلك اكتب الإيميل والباسورد";
          render();
          return;
        }
        state.authBusy = true;
        state.authError = "";
        render();
        try {
          if (state.authMode === "signup") {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
        } catch (e) {
          state.authError = authErrorMessage(e);
          state.authBusy = false;
          render();
        }
      }
      function authErrorMessage(e) {
        const code = (e && e.code) || "";
        if (code.includes("email-already-in-use")) return "الإيميل ده مسجل قبل كده، جرب تسجل دخول بدل إنشاء حساب";
        if (code.includes("invalid-email")) return "صيغة الإيميل غلط";
        if (code.includes("weak-password")) return "الباسورد لازم يكون 6 حروف/أرقام على الأقل";
        if (code.includes("user-not-found") || code.includes("wrong-password") || code.includes("invalid-credential"))
          return "الإيميل أو الباسورد غلط";
        if (code.includes("network-request-failed")) return "مفيش اتصال بالإنترنت";
        return "حصل خطأ، حاول تاني";
      }
      function doLogout() {
        auth.signOut();
      }

      auth.onAuthStateChanged(function (user) {
        state.authChecked = true;
        state.authBusy = false;
        if (user) {
          state.user = { uid: user.uid, email: user.email };
          loadDataForUser(user.uid);
        } else {
          state.user = null;
          state.loaded = false;
          state.subjects = [];
          state.tasks = [];
          state.history = [];
          render();
        }
      });

      /* ---------------- lookups (recursive — folders can be nested) ---------------- */
      function getSubject(id) {
        return state.subjects.find((s) => s.id === id);
      }
      function findFolderRec(folders, id) {
        for (const f of folders || []) {
          if (f.id === id) return f;
          const found = findFolderRec(f.folders, id);
          if (found) return found;
        }
        return null;
      }
      function getFolder(subj, id) {
        return subj ? findFolderRec(subj.folders, id) : null;
      }
      function getFile(folder, id) {
        return folder ? folder.files.find((f) => f.id === id) : null;
      }
      function resolveTask(t) {
        const subj = getSubject(t.subjectId);
        const folder = getFolder(subj, t.folderId);
        const file = getFile(folder, t.fileId);
        return { subj, folder, file };
      }
      // container = the object (subject or folder) whose .folders array directly holds folderId
      function findFolderContainer(subj, folderId) {
        function search(container) {
          for (const f of container.folders || []) {
            if (f.id === folderId) return container;
            const res = search(f);
            if (res) return res;
          }
          return null;
        }
        return subj ? search(subj) : null;
      }

      function findFolderPathIds(folders, targetId, trail) {
        for (const f of folders || []) {
          const newTrail = trail.concat(f.id);
          if (f.id === targetId) return newTrail;
          const res = findFolderPathIds(f.folders, targetId, newTrail);
          if (res) return res;
        }
        return null;
      }
      function goToFileInExplorer(subjectId, folderId, fileId) {
        const subj = getSubject(subjectId);
        if (!subj) return;
        state.selectedSubjectId = subjectId;
        state.folderPath = findFolderPathIds(subj.folders, folderId, []) || [];
        state.view = "explorer";
        render();
        setTimeout(() => {
          const el = document.getElementById("file-row-" + fileId);
          if (el) {
            el.scrollIntoView({ behavior: "smooth", block: "center" });
            el.classList.add("flash-highlight");
            setTimeout(() => el.classList.remove("flash-highlight"), 1600);
          }
        }, 60);
      }

      function getPathTrail(subj, path) {
        let trail = [],
          folders = subj ? subj.folders : [];
        for (const id of path) {
          const f = (folders || []).find((x) => x.id === id);
          if (!f) break;
          trail.push(f);
          folders = f.folders;
        }
        return trail;
      }

      /* ---------------- stats (recursive across nested folders) ---------------- */
      function collectFiles(folder) {
        let files = folder.files ? [...folder.files] : [];
        (folder.folders || []).forEach((sf) => (files = files.concat(collectFiles(sf))));
        return files;
      }
      function subjectAllFiles(subj) {
        let files = [];
        (subj.folders || []).forEach((f) => (files = files.concat(collectFiles(f))));
        return files;
      }
      function collectFilesWithFolder(folder) {
        let items = (folder.files || []).map((f) => ({ folder, file: f }));
        (folder.folders || []).forEach((sf) => {
          items = items.concat(collectFilesWithFolder(sf));
        });
        return items;
      }
      function subjectAllFilesWithFolder(subj) {
        let items = [];
        (subj.folders || []).forEach((f) => {
          items = items.concat(collectFilesWithFolder(f));
        });
        return items;
      }
      function getDueReviews() {
        const due = [];
        const now = new Date();
        const todayOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        state.subjects.forEach((subj) => {
          subjectAllFilesWithFolder(subj).forEach(({ folder, file: f }) => {
            if (!f.done || !f.completedAt) return;
            const stage = f.reviewStage || 0;
            if (stage >= REVIEW_INTERVALS_DAYS.length) return;
            const dueDate = new Date(new Date(f.completedAt).getTime() + REVIEW_INTERVALS_DAYS[stage] * 86400000);
            const dueDateOnly = new Date(dueDate.getFullYear(), dueDate.getMonth(), dueDate.getDate());
            if (dueDateOnly <= todayOnly) due.push({ subj, folder, file: f, stage });
          });
        });
        return due;
      }
      function markReviewDone(subjectId, folderId, fileId) {
        const subj = getSubject(subjectId);
        const folder = getFolder(subj, folderId);
        const f = getFile(folder, fileId);
        if (!f) return;
        f.reviewStage = (f.reviewStage || 0) + 1;
        saveData();
        render();
      }
      function subjectStats(subj) {
        const files = subjectAllFiles(subj);
        const total = files.length,
          done = files.filter((f) => f.done).length;
        return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
      }
      function taskStats() {
        let total = 0,
          done = 0;
        state.tasks.forEach((t) => {
          const { file } = resolveTask(t);
          if (file) {
            total++;
            if (file.done) done++;
          }
        });
        return { total, done, remaining: total - done, pct: total ? Math.round((done / total) * 100) : 0 };
      }

      /* ---------------- cascade cleanup ---------------- */
      function pruneOrphanTasks() {
        state.tasks = state.tasks.filter((t) => {
          const { file } = resolveTask(t);
          return !!file;
        });
      }

      /* ---------------- history (log of what got done, by day) ---------------- */
      function recordHistory(subj, folder, file) {
        if (!state.history) state.history = [];
        const today = todayStr();
        const exists = state.history.some((h) => h.fileId === file.id && h.date === today);
        if (exists) return;
        state.history.unshift({
          id: uid(),
          date: today,
          time: new Date().toTimeString().slice(0, 5),
          fileId: file.id,
          title: file.title,
          category: file.category,
          subjectName: subj.name,
          subjectColor: subj.color,
          folderName: folder.name,
        });
      }
      function unrecordHistoryToday(fileId) {
        const today = todayStr();
        state.history = (state.history || []).filter((h) => !(h.fileId === fileId && h.date === today));
      }
      function removeHistoryEntry(id) {
        state.history = (state.history || []).filter((h) => h.id !== id);
        saveData();
        render();
      }

      // parentFolderId null => add at subject root. Otherwise adds as a subfolder inside that folder (تفرعات).
      function addFolder(subjectId, parentFolderId, name) {
        if (!name.trim()) return;
        const subj = getSubject(subjectId);
        if (!subj) return;
        const container = parentFolderId ? getFolder(subj, parentFolderId) : subj;
        if (!container) return;
        if (!container.folders) container.folders = [];
        container.folders.push({ id: uid(), name: name.trim(), folders: [], files: [] });
        saveData();
        closeModal();
      }
      function deleteFolder(subjectId, folderId) {
        if (!confirm("حذف هذا الفولدر وكل الفولدرات الفرعية والملفات جواه؟ لا يمكن التراجع.")) return;
        const subj = getSubject(subjectId);
        if (!subj) return;
        const container = findFolderContainer(subj, folderId);
        if (!container) return;
        container.folders = container.folders.filter((f) => f.id !== folderId);
        pruneOrphanTasks();
        const idx = state.folderPath.indexOf(folderId);
        if (idx !== -1) state.folderPath = state.folderPath.slice(0, idx);
        saveData();
        render();
      }
      function renameFolder(subjectId, folderId, name) {
        if (!name.trim()) return;
        const subj = getSubject(subjectId);
        const folder = getFolder(subj, folderId);
        if (!folder) return;
        folder.name = name.trim();
        saveData();
        closeModal();
      }

      /* ---------------- move (drag-free "file explorer" relocate: files & folders can be
         moved to any folder / subject. Review progress (done/completedAt/reviewStage) lives
         on the file object itself and getDueReviews() walks the live tree each render, so a
         moved file's due-review always resolves to its new, correct location automatically.
         Imported tasks store their own subjectId/folderId snapshot though, so those are
         re-pointed here to keep "المهام" pointing at the right place after a move. ---------------- */
      function collectDescendantFolderIds(folder) {
        let ids = [folder.id];
        (folder.folders || []).forEach((sf) => {
          ids = ids.concat(collectDescendantFolderIds(sf));
        });
        return ids;
      }
      function moveFile(subjectId, folderId, fileId, targetSubjectId, targetFolderId) {
        const subj = getSubject(subjectId);
        const folder = getFolder(subj, folderId);
        const file = getFile(folder, fileId);
        const targetSubj = getSubject(targetSubjectId);
        const targetFolder = targetSubj ? getFolder(targetSubj, targetFolderId) : null;
        if (!file || !targetFolder) return;
        if (targetFolder === folder) {
          closeModal();
          return;
        }
        folder.files = folder.files.filter((f) => f.id !== fileId);
        if (!targetFolder.files) targetFolder.files = [];
        targetFolder.files.push(file);
        state.tasks.forEach((t) => {
          if (t.subjectId === subjectId && t.folderId === folderId && t.fileId === fileId) {
            t.subjectId = targetSubjectId;
            t.folderId = targetFolderId;
          }
        });
        state.selectedSubjectId = targetSubjectId;
        state.folderPath = findFolderPathIds(targetSubj.folders, targetFolderId, []) || [];
        saveData();
        closeModal();
        render();
      }
      function moveFolder(subjectId, folderId, targetSubjectId, targetParentFolderId) {
        const subj = getSubject(subjectId);
        const folder = getFolder(subj, folderId);
        if (!folder) return;
        const excluded = collectDescendantFolderIds(folder);
        if (targetParentFolderId && excluded.includes(targetParentFolderId)) return;
        const container = findFolderContainer(subj, folderId);
        if (!container) return;
        const targetSubj = getSubject(targetSubjectId);
        if (!targetSubj) return;
        const targetContainer = targetParentFolderId ? getFolder(targetSubj, targetParentFolderId) : targetSubj;
        if (!targetContainer) return;
        if (targetContainer === container) {
          closeModal();
          return;
        }
        container.folders = container.folders.filter((f) => f.id !== folderId);
        if (!targetContainer.folders) targetContainer.folders = [];
        targetContainer.folders.push(folder);
        if (targetSubjectId !== subjectId) {
          const fileIds = new Set(collectFiles(folder).map((f) => f.id));
          state.tasks.forEach((t) => {
            if (t.subjectId === subjectId && fileIds.has(t.fileId)) t.subjectId = targetSubjectId;
          });
        }
        state.selectedSubjectId = targetSubjectId;
        state.folderPath = findFolderPathIds(targetSubj.folders, folderId, []) || [];
        saveData();
        closeModal();
        render();
      }

      function saveFile(subjectId, folderId, fileId, data) {
        const subj = getSubject(subjectId);
        const folder = getFolder(subj, folderId);
        if (!folder) return;
        if (!folder.files) folder.files = [];
        if (fileId) {
          const f = getFile(folder, fileId);
          Object.assign(f, data);
        } else {
          folder.files.push({ id: uid(), done: false, note: "", ...data });
        }
        saveData();
        closeModal();
      }
      function toggleFile(subjectId, folderId, fileId) {
        const subj = getSubject(subjectId);
        const folder = getFolder(subj, folderId);
        const f = getFile(folder, fileId);
        f.done = !f.done;
        if (f.done) {
          recordHistory(subj, folder, f);
          f.completedAt = new Date().toISOString();
          f.reviewStage = 0;
        } else {
          unrecordHistoryToday(f.id);
          f.completedAt = null;
          f.reviewStage = 0;
        }
        saveData();
        render();
      }
      function deleteFile(subjectId, folderId, fileId) {
        if (!confirm("حذف هذا الملف نهائيًا؟")) return;
        const subj = getSubject(subjectId);
        const folder = getFolder(subj, folderId);
        folder.files = folder.files.filter((x) => x.id !== fileId);
        pruneOrphanTasks();
        saveData();
        render();
      }
      function saveNote(subjectId, folderId, fileId, note) {
        const subj = getSubject(subjectId);
        const folder = getFolder(subj, folderId);
        const f = getFile(folder, fileId);
        f.note = note;
        saveData();
      }

      /* ---------------- rich notes (formatted text + images, per file) ---------------- */
      function stripHtml(html) {
        const div = document.createElement("div");
        div.innerHTML = html || "";
        return (div.textContent || div.innerText || "").trim();
      }
      function hasNoteContent(f) {
        if (f.noteHtml) return !!stripHtml(f.noteHtml);
        return !!(f.note && f.note.trim());
      }
      function sanitizeNoteHTML(html) {
        const div = document.createElement("div");
        div.innerHTML = html || "";
        div.querySelectorAll("script, style, iframe, object, embed").forEach((el) => el.remove());
        div.querySelectorAll("*").forEach((el) => {
          [...el.attributes].forEach((attr) => {
            const name = attr.name.toLowerCase();
            const val = (attr.value || "").trim().toLowerCase();
            if (name.startsWith("on")) el.removeAttribute(attr.name);
            if ((name === "href" || name === "src") && val.startsWith("javascript:")) el.removeAttribute(attr.name);
          });
        });
        return div.innerHTML;
      }
      function saveNoteRich(subjectId, folderId, fileId, html) {
        const subj = getSubject(subjectId);
        const folder = getFolder(subj, folderId);
        const f = getFile(folder, fileId);
        if (!f) return;
        const clean = sanitizeNoteHTML(html);
        f.noteHtml = clean;
        f.note = stripHtml(clean);
        saveData();
      }
      function compressImageFile(file, maxWidth = 900, quality = 0.72) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              let w = img.width,
                h = img.height;
              if (w > maxWidth) {
                h = Math.round(h * (maxWidth / w));
                w = maxWidth;
              }
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              canvas.getContext("2d").drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL("image/jpeg", quality));
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }
      let noteSavedRange = null;
      function saveNoteSelection() {
        const sel = window.getSelection();
        const editor = document.getElementById("note-editor");
        if (sel && sel.rangeCount > 0 && editor && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
          noteSavedRange = sel.getRangeAt(0).cloneRange();
        }
      }
      function restoreNoteSelection() {
        const editor = document.getElementById("note-editor");
        if (!editor) return;
        editor.focus();
        const sel = window.getSelection();
        sel.removeAllRanges();
        if (noteSavedRange) {
          sel.addRange(noteSavedRange);
        } else {
          const range = document.createRange();
          range.selectNodeContents(editor);
          range.collapse(false);
          sel.addRange(range);
        }
      }
      function insertImageIntoNote(dataUrl) {
        restoreNoteSelection();
        const sel = window.getSelection();
        if (sel.rangeCount === 0) return;
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const img = document.createElement("img");
        img.src = dataUrl;
        range.insertNode(img);
        range.setStartAfter(img);
        range.setEndAfter(img);
        sel.removeAllRanges();
        sel.addRange(range);
        noteSavedRange = range.cloneRange();
      }

      function noteExec(cmd) {

      async function handleNoteImageUpload(input) {
        const file = input.files && input.files[0];
        if (!file) {
          return;
        }
        if (!file.type.startsWith("image/")) {
          input.value = "";
          return;
        }
        try {
          const dataUrl = await compressImageFile(file);
          insertImageIntoNote(dataUrl);
        } catch (e) {
          console.error(e);
          alert("تعذر رفع الصورة");
        }
        input.value = "";
      }
      function handleNotePaste(e) {
        const items = (e.clipboardData && e.clipboardData.items) || [];
        for (const item of items) {
          if (item.kind === "file" && item.type.startsWith("image/")) {
            e.preventDefault();
            const file = item.getAsFile();
            saveNoteSelection();
            compressImageFile(file)
              .then(insertImageIntoNote)
              .catch((err) => console.error(err));
            return;
          }
        }
        const html = e.clipboardData && e.clipboardData.getData("text/html");
        if (html && html.trim()) {
          e.preventDefault();
          const cleaned = cleanPastedHTML(html);
          const editor = document.getElementById("note-editor");
          if (editor) editor.focus();
          document.execCommand("insertHTML", false, cleaned || "");
          return;
        }
        // no rich HTML available (e.g. plain unicode text) — let the browser's
        // default plain-text paste happen, this already preserves things like
        // copied ⇌ ² ₂ Δ characters since they're just normal text.
      }
      // keeps a formula/fraction's structure (bold, sub/sup, tables, images,
      // links, our own note-frac fraction spans) when pasted from elsewhere,
      // while stripping fonts/colors/junk markup so notes stay consistent.
      function cleanPastedHTML(html) {
        const allowedTags = new Set([
          "B",
          "STRONG",
          "I",
          "EM",
          "U",
          "SUB",
          "SUP",
          "BR",
          "P",
          "DIV",
          "UL",
          "OL",
          "LI",
          "SPAN",
          "IMG",
          "A",
          "TABLE",
          "TBODY",
          "TR",
          "TD",
        ]);
        const div = document.createElement("div");
        div.innerHTML = html;
        div
          .querySelectorAll("script, style, iframe, object, embed, meta, link, head, title")
          .forEach((el) => el.remove());
        const cleanNode = (node) => {
          [...node.childNodes].forEach((child) => {
            if (child.nodeType === 1) {
              if (!allowedTags.has(child.tagName)) {
                while (child.firstChild) child.parentNode.insertBefore(child.firstChild, child);
                child.parentNode.removeChild(child);
                return;
              }
              const isFracPart =
                child.classList.contains("note-frac") ||
                child.classList.contains("note-frac-num") ||
                child.classList.contains("note-frac-den");
              [...child.attributes].forEach((attr) => {
                const name = attr.name.toLowerCase();
                if (name === "class" && isFracPart) return;
                if (
                  child.tagName === "IMG" &&
                  name === "src" &&
                  !attr.value.trim().toLowerCase().startsWith("javascript:")
                )
                  return;
                if (
                  child.tagName === "A" &&
                  name === "href" &&
                  !attr.value.trim().toLowerCase().startsWith("javascript:")
                )
                  return;
                child.removeAttribute(attr.name);
              });
              cleanNode(child);
            } else if (child.nodeType !== 3) {
              child.remove();
            }
          });
        };
        cleanNode(div);
        return div.innerHTML;
      }
      function submitNote(subjectId, folderId, fileId) {
        const editor = document.getElementById("note-editor");
        const html = editor ? editor.innerHTML : "";
        saveNoteRich(subjectId, folderId, fileId, html);
        closeModal();
      }

      /* ---------------- backup (export / import everything as a file) ---------------- */
      function exportBackup() {
        const data = {
          app: "study-manager",
          version: 1,
          exportedAt: new Date().toISOString(),
          subjects: state.subjects,
          tasks: state.tasks,
          history: state.history || [],
          platforms: state.platforms || [],
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `study-backup-${todayStr()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
      function triggerImportBackup() {
        const input = document.getElementById("backup-file-input");
        if (input) input.click();
      }
      function handleImportBackup(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (!data || !Array.isArray(data.subjects) || !Array.isArray(data.tasks)) {
              alert("ملف النسخة الاحتياطية غير صالح.");
              return;
            }
            if (
              !confirm(
                "استيراد النسخة الاحتياطية هيستبدل كل البيانات الحالية (المواد، الملفات، المهام، السجل، المنصات). متأكد؟",
              )
            )
              return;
            state.subjects = data.subjects || [];
            state.tasks = data.tasks || [];
            state.history = data.history || [];
            state.platforms = data.platforms || [];
            state.selectedSubjectId = state.subjects[0] ? state.subjects[0].id : null;
            state.folderPath = [];
            state.view = "home";
            saveData();
            render();
          } catch (err) {
            alert("تعذر قراءة ملف النسخة الاحتياطية.");
          }
        };
        reader.readAsText(file);
        input.value = "";
      }

      /* ---------------- tasks (import references) ---------------- */
      function importTask(subjectId, folderId, fileId) {
        const already = state.tasks.find(
          (t) => t.subjectId === subjectId && t.folderId === folderId && t.fileId === fileId,
        );
        if (already) return;
        state.tasks.push({ id: uid(), subjectId, folderId, fileId });
        saveData();
        render();
      }
      function removeTask(taskId) {
        state.tasks = state.tasks.filter((t) => t.id !== taskId);
        saveData();
        render();
      }
      function setTaskFilter(f) {
        state.taskFilter = f;
        render();
      }
      function clearCompletedTasks() {
        const doneTasks = state.tasks.filter((t) => {
          const { file } = resolveTask(t);
          return file && file.done;
        });
        if (doneTasks.length === 0) return;
        if (!confirm(`مسح ${doneTasks.length} مهمة مكتملة من اللستة؟ (السجل هيفضل محفوظ)`)) return;
        const doneIds = new Set(doneTasks.map((t) => t.id));
        state.tasks = state.tasks.filter((t) => !doneIds.has(t.id));
        saveData();
        render();
      }
      function toggleTaskDone(t) {
        const { subj, folder, file } = resolveTask(t);
        if (!file) return;
        file.done = !file.done;
        if (file.done) {
          recordHistory(subj, folder, file);
          file.completedAt = new Date().toISOString();
          file.reviewStage = 0;
        } else {
          unrecordHistoryToday(file.id);
          file.completedAt = null;
          file.reviewStage = 0;
        }
        saveData();
        render();
      }

          filteredTasks.length === 0
            ? `
          <div style="text-align:center; color:var(--faint); padding:30px 20px; border:1.5px dashed var(--border); border-radius:12px;">
            <div style="font-size:13px;">مفيش مهام في الفلتر ده</div>
          </div>
        `
            : `
          <div style="display:flex; flex-direction:column; gap:6px;">
            ${filteredTasks.map(taskRow).join("")}
          </div>
        `
        }
      `
      }
    </div>
  `;
      }

      function taskRow(t) {
        const { subj, folder, file } = resolveTask(t);
        if (!file) return "";
        const noteExists = hasNoteContent(file);
        return `
  <div class="file-row" style="display:flex; align-items:flex-start; gap:12px; padding:11px 12px; border:1px solid var(--border-soft); border-radius:11px; ${file.done ? "opacity:0.6;" : ""}">
    <div class="check-btn" data-done="${file.done}" onclick='toggleTaskDone(${JSON.stringify(t)})' style="margin-top:1px;">
      ${file.done ? '<i data-lucide="check" style="width:14px;height:14px;color:#06110B;"></i>' : ""}
    </div>
    <div style="flex:1; min-width:0;">
      <div style="font-weight:600; font-size:14px; ${file.done ? "text-decoration:line-through; text-decoration-color:var(--faint);" : ""} overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(file.title)}</div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap;">
        ${categoryBadgeHTML(file.category, subj)}
        <span style="font-size:11.5px; color:var(--faint);">${esc(subj.name)} / ${esc(folder.name)}</span>
        ${file.link ? `<a href="${esc(file.link)}" target="_blank" rel="noopener" style="color:var(--accent); display:flex; align-items:center; gap:3px; font-size:12px; font-weight:600;"><i data-lucide="play-circle" style="width:12px;height:12px;"></i> ادخل الدرس</a>` : ""}
        ${file.pdfLink ? `<a href="${esc(file.pdfLink)}" target="_blank" rel="noopener" style="color:var(--muted); display:flex; align-items:center; gap:3px; font-size:12px;"><i data-lucide="file-text" style="width:12px;height:12px;"></i> PDF</a>` : ""}
        <span onclick="openModal({type:'note', subjectId:'${subj.id}', folderId:'${folder.id}', fileId:'${file.id}'})" style="color:${noteExists ? "var(--warning)" : "var(--faint)"}; cursor:pointer; display:flex; align-items:center; gap:3px; font-size:12px; font-weight:600;"><i data-lucide="sticky-note" style="width:12px;height:12px;"></i> ${noteExists ? "تعديل الملاحظة" : "إضافة ملاحظة"}</span>
      </div>
      ${
        noteExists
          ? `
      <div id="note-display-${file.id}" class="rich-note-display collapsed">${file.noteHtml || `<p>${esc(file.note)}</p>`}</div>
      <div id="note-toggle-${file.id}" class="note-toggle-btn" onclick="toggleNoteExpand('${file.id}')">
        <span class="note-toggle-label">عرض المزيد</span><i data-lucide="chevron-down" style="width:12px;height:12px;"></i>
      </div>`
          : ""
      }
    </div>
    <button class="hover-actions" onclick="removeTask('${t.id}')" title="إزالة من المهام" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:6px; flex-shrink:0;">
      <i data-lucide="x" style="width:15px;height:15px;"></i>
    </button>
  </div>`;
      }

      /* ---------------- EXPLORER VIEW (subjects -> nested folders -> files) ---------------- */
      function renderExplorer() {
        const selectedSubj = getSubject(state.selectedSubjectId);

        return `
    <div class="explorer-row">
      <div class="dash-card explorer-sidebar" style="flex-shrink:0; overflow:hidden;">
        <div style="padding:12px 14px 8px; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.3px;">المواد</div>
        <div>
          ${state.subjects
            .map((s) => {
              const st = subjectStats(s);
              const active = s.id === state.selectedSubjectId;
              return `
            <div class="sidebar-item" data-active="${active}" style="display:flex; align-items:center; justify-content:space-between; padding:9px 14px; cursor:pointer;" onclick="selectSubject('${s.id}')">
              <div style="display:flex; align-items:center; gap:9px; min-width:0;">
                ${subjectIconHTML(s)}
                <span style="font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(s.name)}</span>
              </div>
              <span class="mono" style="font-size:11px; color:var(--faint); flex-shrink:0;">${st.pct}%</span>
            </div>`;
            })
            .join("")}
        </div>
        <div style="padding:10px 14px 14px;">
          <button onclick="openModal({type:'subject'})" style="width:100%; display:flex; align-items:center; justify-content:center; gap:6px; background:none; border:1.5px dashed var(--border); color:var(--muted); border-radius:10px; padding:9px; font-size:13px; font-weight:600; cursor:pointer;">
            <i data-lucide="plus" style="width:15px;height:15px;"></i> مادة جديدة
          </button>
        </div>
      </div>

      <div class="dash-card" style="flex:1; min-width:0; padding:18px;">
        ${
          !selectedSubj
            ? `
          <div style="text-align:center; color:var(--faint); padding:60px 20px;">
            <i data-lucide="folder-open" style="width:34px;height:34px; margin-bottom:10px;"></i>
            <div style="font-size:14px;">أضف مادة من القائمة الجانبية لتبدأ إضافة الفولدرات والملفات</div>
          </div>
        `
            : renderFolderLevel(selectedSubj)
        }
      </div>
    </div>
  `;
      }

      // Renders whatever level of the folder tree the user is currently browsing (subject root,
      // or any nested folder), based on state.folderPath. Folders can contain subfolders (تفرعات)
      // as well as files at the same time.
      function renderFolderLevel(subj) {
        const path = state.folderPath;
        const trail = getPathTrail(subj, path);
        const folder = trail.length ? trail[trail.length - 1] : null;
        const foldersArr = folder ? folder.folders || [] : subj.folders || [];
        const directFiles = folder ? folder.files || [] : [];
        const doneCount = directFiles.filter((x) => x.done).length;
        const sStats = subjectStats(subj);

        const breadcrumbHTML = `
    <div style="display:flex; align-items:center; gap:6px; margin-bottom:14px; font-size:12.5px; flex-wrap:wrap;">
      <span class="crumb" onclick="goToDepth(-1)" style="${trail.length ? "" : "color:var(--text); font-weight:700;"}">${esc(subj.name)}</span>
      ${trail
        .map(
          (f, i) => `
        <i data-lucide="chevron-left" style="width:13px;height:13px; color:var(--faint);"></i>
        <span class="crumb" onclick="goToDepth(${i})" style="${i === trail.length - 1 ? "color:var(--text); font-weight:700;" : ""}">${esc(f.name)}</span>
      `,
        )
        .join("")}
    </div>
  `;

        const headerHTML = `
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
      <div style="display:flex; align-items:center; gap:11px;">
        ${
          folder
            ? `
          <button onclick="goUp()" style="background:var(--surface-3); border:none; border-radius:9px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; flex-shrink:0;">
            <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
          </button>
        `
            : subjectIconHTML(subj, 22)
        }
        <div>
          <div style="font-weight:800; font-size:17px;">${folder ? esc(folder.name) : esc(subj.name)}</div>
          <div class="mono" style="font-size:12px; color:var(--muted);">${
            folder
              ? `${doneCount}/${directFiles.length} ملف مباشر في الفولدر ده`
              : `${sStats.done}/${sStats.total} ملف مكتمل · ${sStats.pct}%`
          }</div>
        </div>
      </div>
      <div style="display:flex; gap:8px;">
        <button onclick='openModal({type:"folder", subjectId:"${subj.id}", parentFolderId:${folder ? `"${folder.id}"` : null}})' class="btn-primary" style="display:flex; align-items:center; gap:6px;">
          <i data-lucide="folder-plus" style="width:15px;height:15px;"></i> فولدر جديد
        </button>
        ${
          folder
            ? `
          <button onclick='openModal({type:"file", subjectId:"${subj.id}", folderId:"${folder.id}"})' class="btn-primary" style="display:flex; align-items:center; gap:6px;">
            <i data-lucide="plus" style="width:15px;height:15px;"></i> ملف جديد
          </button>
        `
            : `
          <button onclick="deleteSubject('${subj.id}')" title="حذف المادة" style="background:none; border:1px solid var(--border); border-radius:10px; padding:0 12px; color:var(--faint); cursor:pointer;">
            <i data-lucide="trash-2" style="width:15px;height:15px;"></i>
          </button>
        `
        }
      </div>
    </div>
  `;

        const gridHTML =
          foldersArr.length === 0
            ? `
      <div style="text-align:center; color:var(--faint); padding:${folder ? "26px" : "48px"} 20px; border:1.5px dashed var(--border); border-radius:12px; ${folder ? "margin-bottom:16px;" : ""}">
        <div style="font-size:13.5px;">لا توجد فولدرات فرعية بعد${folder ? " — تقدر تضيف فولدر جواه" : ""}</div>
      </div>
    `
            : `
      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:12px; ${folder ? "margin-bottom:20px;" : ""}">
        ${foldersArr
          .map((f) => {
            const files = collectFiles(f);
            const done = files.filter((x) => x.done).length;
            const subCount = (f.folders || []).length;
            return `
          <div class="folder-card" style="border:1px solid var(--border-soft); border-radius:13px; padding:16px; cursor:pointer; position:relative;" onclick="openFolder('${f.id}')">
            <div class="hover-actions" style="position:absolute; top:6px; left:6px; display:flex; gap:2px;">
              <button onclick="event.stopPropagation(); openModal({type:'folder', subjectId:'${subj.id}', parentFolderId:${folder ? `'${folder.id}'` : "null"}, folderId:'${f.id}'})" title="إعادة تسمية" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:4px;">
                <i data-lucide="pencil" style="width:13px;height:13px;"></i>
              </button>
              <button onclick="event.stopPropagation(); openModal({type:'move-folder', subjectId:'${subj.id}', folderId:'${f.id}'})" title="نقل الفولدر" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:4px;">
                <i data-lucide="move" style="width:13px;height:13px;"></i>
              </button>
              <button onclick="event.stopPropagation(); deleteFolder('${subj.id}','${f.id}')" title="حذف الفولدر" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:4px;">
                <i data-lucide="x" style="width:13px;height:13px;"></i>
              </button>
            </div>
            ${folderIconSVG(subj.color, 30)}
            <div style="font-weight:700; font-size:14px; margin-top:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(f.name)}</div>
            <div class="mono" style="font-size:11.5px; color:var(--faint); margin-top:3px;">${done}/${files.length} ملف${subCount ? " · " + subCount + " فولدر فرعي" : ""}</div>
          </div>`;
          })
          .join("")}
      </div>
    `;

        const filesHTML = !folder
          ? ""
          : directFiles.length === 0
            ? `
      <div style="text-align:center; color:var(--faint); padding:36px 20px; border:1.5px dashed var(--border); border-radius:12px;">
        <div style="font-size:13.5px;">لا توجد ملفات مباشرة في "${esc(folder.name)}" بعد</div>
      </div>
    `
            : `
      <div style="display:flex; flex-direction:column; gap:6px;">
        ${directFiles.map((f) => renderFileRow(subj, folder, f)).join("")}
      </div>
    `;

        return breadcrumbHTML + headerHTML + gridHTML + filesHTML;
      }

      function renderFileRow(subj, folder, f) {
        const alreadyTask = state.tasks.some(
          (t) => t.fileId === f.id && t.folderId === folder.id && t.subjectId === subj.id,
        );
        const noteExists = hasNoteContent(f);
        return `
  <div id="file-row-${f.id}" class="file-row" style="display:flex; align-items:flex-start; gap:12px; padding:11px 12px; border:1px solid var(--border-soft); border-radius:11px; ${f.done ? "opacity:0.6;" : ""}">
    <div class="check-btn" data-done="${f.done}" onclick="toggleFile('${subj.id}','${folder.id}','${f.id}')" style="margin-top:1px;">
      ${f.done ? '<i data-lucide="check" style="width:14px;height:14px;color:#06110B;"></i>' : ""}
    </div>
    <div style="flex:1; min-width:0;">
      <div style="font-weight:600; font-size:14px; ${f.done ? "text-decoration:line-through; text-decoration-color:var(--faint);" : ""} overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(f.title)}</div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap;">
        ${categoryBadgeHTML(f.category, subj)}
        ${f.link ? `<a href="${esc(f.link)}" target="_blank" rel="noopener" style="color:var(--muted); display:flex; align-items:center; gap:3px; font-size:12px;"><i data-lucide="link-2" style="width:12px;height:12px;"></i> رابط الدرس</a>` : ""}
        ${f.pdfLink ? `<a href="${esc(f.pdfLink)}" target="_blank" rel="noopener" style="color:var(--muted); display:flex; align-items:center; gap:3px; font-size:12px;"><i data-lucide="file-text" style="width:12px;height:12px;"></i> PDF</a>` : ""}
        ${alreadyTask ? `<span style="font-size:11px; color:var(--success); display:flex; align-items:center; gap:3px;"><i data-lucide="check-circle" style="width:11px;height:11px;"></i> ضمن المهام</span>` : `<span onclick="importTask('${subj.id}','${folder.id}','${f.id}')" style="font-size:11px; color:var(--accent); cursor:pointer; font-weight:600; display:flex; align-items:center; gap:3px;"><i data-lucide="import" style="width:11px;height:11px;"></i> إضافة كمهمة</span>`}
        <span onclick="openModal({type:'note', subjectId:'${subj.id}', folderId:'${folder.id}', fileId:'${f.id}'})" style="color:${noteExists ? "var(--warning)" : "var(--faint)"}; cursor:pointer; display:flex; align-items:center; gap:3px; font-size:12px; font-weight:600;"><i data-lucide="sticky-note" style="width:12px;height:12px;"></i> ${noteExists ? "تعديل الملاحظة" : "إضافة ملاحظة"}</span>
      </div>
      ${
        noteExists
          ? `
      <div id="note-display-${f.id}" class="rich-note-display collapsed">${f.noteHtml || `<p>${esc(f.note)}</p>`}</div>
      <div id="note-toggle-${f.id}" class="note-toggle-btn" onclick="toggleNoteExpand('${f.id}')">
        <span class="note-toggle-label">عرض المزيد</span><i data-lucide="chevron-down" style="width:12px;height:12px;"></i>
      </div>`
          : ""
      }
    </div>
    <div class="hover-actions" style="display:flex; gap:4px; flex-shrink:0;">
      <button onclick='openModal({type:"file", subjectId:"${subj.id}", folderId:"${folder.id}", fileId:"${f.id}"})' title="تعديل" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:6px;">
        <i data-lucide="pencil" style="width:14px;height:14px;"></i>
      </button>
      <button onclick="openModal({type:'move-file', subjectId:'${subj.id}', folderId:'${folder.id}', fileId:'${f.id}'})" title="نقل الملف" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:6px;">
        <i data-lucide="move" style="width:14px;height:14px;"></i>
      </button>
      <button onclick="deleteFile('${subj.id}','${folder.id}','${f.id}')" title="حذف" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:6px;">
        <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
      </button>
    </div>
  </div>`;
      }

      /* ---------------- HISTORY VIEW (what got done, grouped by day) ---------------- */
      function renderHistory() {
        const history = state.history || [];
        if (history.length === 0) {
          return `
    <div class="dash-card" style="padding:60px 20px; text-align:center; color:var(--faint);">
      <i data-lucide="history" style="width:34px;height:34px; margin-bottom:10px;"></i>
      <div style="font-size:14px;">لسه مفيش سجل — أول ما تحدد أي ملف أو مهمة "تم" هيتسجل هنا حسب يوم إنجازه</div>
    </div>`;
        }
        const groups = {};
        history.forEach((h) => {
          (groups[h.date] = groups[h.date] || []).push(h);
        });
        const dates = Object.keys(groups).sort((a, b) => b.localeCompare(a));
        return `
    <div style="display:flex; flex-direction:column; gap:14px;">
      ${dates
        .map((date) => {
          const entries = groups[date].slice().sort((a, b) => (b.time || "").localeCompare(a.time || ""));
          return `
        <div class="dash-card" style="padding:16px 18px;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:6px;">
            <div style="font-weight:800; font-size:14.5px;">${esc(formatDateLabel(date))}</div>
            <span class="mono" style="font-size:11.5px; color:var(--faint);">${entries.length} ${entries.length === 1 ? "مهمة" : "مهام"}</span>
          </div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            ${entries.map(renderHistoryRow).join("")}
          </div>
        </div>`;
        })
        .join("")}
    </div>
  `;
      }
      function formatDateLabel(dateStr) {
        const [y, m, d] = dateStr.split("-").map(Number);
        const dt = new Date(y, m - 1, d);
        let label = dt.toLocaleDateString("ar-EG", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
        const today = todayStr();
        const yestD = new Date();
        yestD.setDate(yestD.getDate() - 1);
        const yest = `${yestD.getFullYear()}-${String(yestD.getMonth() + 1).padStart(2, "0")}-${String(yestD.getDate()).padStart(2, "0")}`;
        if (dateStr === today) return `اليوم — ${label}`;
        if (dateStr === yest) return `أمس — ${label}`;
        return label;
      }
      function renderHistoryRow(h) {
        const catColor = CATEGORY_COLORS[h.category] || "var(--accent)";
        return `
  <div class="file-row" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--border-soft); border-radius:11px;">
    <div style="width:22px; height:22px; border-radius:7px; background:var(--success); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <i data-lucide="check" style="width:14px;height:14px; color:#06110B;"></i>
    </div>
    <div style="flex:1; min-width:0;">
      <div style="font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(h.title)}</div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap;">
        <span class="badge" style="background:${catColor}22; color:${catColor};">${esc(h.category)}</span>
        <span style="font-size:11.5px; color:var(--faint);">${esc(h.subjectName)} / ${esc(h.folderName)}</span>
        ${h.time ? `<span class="mono" style="font-size:11px; color:var(--faint);">${esc(h.time)}</span>` : ""}
      </div>
    </div>
    <button class="hover-actions" onclick="openModal({type:'history-edit', id:'${h.id}'})" title="تعديل تاريخ ووقت المهمة" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:6px; flex-shrink:0;">
      <i data-lucide="pencil" style="width:15px;height:15px;"></i>
    </button>
    <button class="hover-actions" onclick="removeHistoryEntry('${h.id}')" title="حذف من السجل" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:6px; flex-shrink:0;">
      <i data-lucide="x" style="width:15px;height:15px;"></i>
    </button>
  </div>`;
      }

      /* ---------------- MODALS ---------------- */
      function renderModal() {
        const m = state.modal;
        if (m.type === "subject") return renderSubjectModal();
        if (m.type === "folder") return renderFolderModal(m);
        if (m.type === "file") return renderFileModal(m);
        if (m.type === "import") return renderImportModal();
        if (m.type === "move-file" || m.type === "move-folder") return renderMoveModal(m);
        if (m.type === "note") return renderNoteModal(m);
        if (m.type === "platform") return renderPlatformModal(m);
        if (m.type === "platform-edit") return renderPlatformModal(m);
        if (m.type === "link-subjects") return renderLinkSubjectsModal();
        if (m.type === "history-edit") return renderHistoryEditModal(m);
        return "";
      }

      function renderHistoryEditModal(m) {
        const h = (state.history || []).find((x) => x.id === m.id);
        if (!h) return "";
        return `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-card dash-card" style="width:340px; padding:22px;">
      <div style="font-weight:800; font-size:16px; margin-bottom:4px;">تعديل تاريخ ووقت الإنجاز</div>
      <div style="color:var(--muted); font-size:12.5px; margin-bottom:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(h.title)}</div>
      <label style="font-size:12.5px; color:var(--muted); display:block; margin-bottom:6px;">التاريخ</label>
      <input id="hist-date-input" type="date" class="field-input" value="${esc(h.date || "")}" style="margin-bottom:16px;">
      <label style="font-size:12.5px; color:var(--muted); display:block; margin-bottom:6px;">الساعة</label>
      <input id="hist-time-input" type="time" class="field-input" value="${esc(h.time || "")}" style="margin-bottom:20px;">
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
        <button class="btn-primary" onclick="saveHistoryEdit('${h.id}')">حفظ</button>
      </div>
    </div>
  </div>`;
      }
      function findFileById(fileId) {
        for (const subj of state.subjects) {
          for (const { file } of subjectAllFilesWithFolder(subj)) {
            if (file.id === fileId) return file;
          }
        }
        return null;

      function renderMoveModal(m) {
        const isFolder = m.type === "move-folder";
        const subj = getSubject(m.subjectId);
        if (!subj) return "";
        const sourceFolder = getFolder(subj, m.folderId);
        if (!sourceFolder) return "";
        const itemLabel = isFolder ? sourceFolder.name : (getFile(sourceFolder, m.fileId) || {}).title || "";
        if (!isFolder && !getFile(sourceFolder, m.fileId)) return "";
        const excludeFolderIds = isFolder ? collectDescendantFolderIds(sourceFolder) : [];
        const container = isFolder ? findFolderContainer(subj, m.folderId) : null;
        const currentContainerId = isFolder ? (container === subj ? null : container.id) : m.folderId;

        function moveCall(targetSubjectId, targetFolderId) {
          const tf = targetFolderId ? `'${targetFolderId}'` : "null";
          return isFolder
            ? `moveFolder('${m.subjectId}','${m.folderId}','${targetSubjectId}',${tf})`
            : `moveFile('${m.subjectId}','${m.folderId}','${m.fileId}','${targetSubjectId}',${tf})`;
        }

        function renderTree(subjParam, folders, depth) {
          return (folders || [])
            .map((f) => {
              if (excludeFolderIds.includes(f.id)) return "";
              const isCurrent = subjParam.id === m.subjectId && f.id === currentContainerId;
              return `
        <div class="import-row" style="padding-right:${10 + depth * 16}px; cursor:${isCurrent ? "default" : "pointer"}; opacity:${isCurrent ? 0.5 : 1};" ${isCurrent ? "" : `onclick="${moveCall(subjParam.id, f.id)}"`}>
          <span style="display:flex; align-items:center; gap:7px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            <i data-lucide="folder" style="width:14px;height:14px; color:var(--faint); flex-shrink:0;"></i> ${esc(f.name)}
          </span>
          ${isCurrent ? `<span style="font-size:10.5px; color:var(--faint); flex-shrink:0;">هنا حاليًا</span>` : ""}
        </div>
        ${renderTree(subjParam, f.folders, depth + 1)}`;
            })
            .join("");
        }

        return `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-card dash-card" style="width:440px; padding:22px; max-height:82vh; display:flex; flex-direction:column;">
      <div style="font-weight:800; font-size:16px; margin-bottom:4px;">${isFolder ? "نقل الفولدر" : "نقل الملف"}</div>
      <div style="color:var(--muted); font-size:12.5px; margin-bottom:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(itemLabel)}</div>
      <div style="overflow-y:auto; flex:1; margin:-4px; padding:4px;">
        ${state.subjects
          .map((s) => {
            const rootIsCurrent = isFolder && s.id === m.subjectId && currentContainerId === null;
            const rootClickable = isFolder && !rootIsCurrent;
            return `
        <div style="margin-bottom:10px;">
          <div class="import-row" style="font-weight:700; font-size:13.5px; color:${s.color}; cursor:${rootClickable ? "pointer" : "default"}; opacity:${rootIsCurrent ? 0.5 : 1};" ${rootClickable ? `onclick="${moveCall(s.id, null)}"` : ""}>
            <span style="display:flex; align-items:center; gap:7px;">${subjectIconHTML(s, 15)} ${esc(s.name)}</span>
            ${isFolder ? `<span style="font-size:10.5px; color:var(--faint); flex-shrink:0;">${rootIsCurrent ? "هنا حاليًا" : "جذر المادة"}</span>` : ""}
          </div>
          ${renderTree(s, s.folders, 1)}
        </div>`;
          })
          .join("")}
      </div>
      <div style="display:flex; justify-content:flex-end; margin-top:14px;">
        <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      </div>
    </div>
  </div>`;
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && state.modal) closeModal();
      });

      render();
    </script>
  </body>
</html>
